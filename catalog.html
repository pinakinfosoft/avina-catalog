<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVINA JEWELS | Jewelry Catalog</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500&display=swap');

        :root {
            --gold: #80011f;
            --gold-light: #9e0226;
            --gold-dark: #5a0115;
            --dark-bg: #fff9eb;
            --dark-panel: #f5edd8;
            --primary: #80011f;
            --primary-hover: #9e0226;
            --text-main: #1a0008;
            --text-muted: rgba(26, 0, 8, 0.55);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 2.5rem;
            background: rgba(245, 237, 216, 0.97);
            border-bottom: 1px solid rgba(128, 1, 31, 0.4);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 0.5rem;
            z-index: 100;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 1rem;
            text-decoration: none;
        }

        .header-logo img {
            height: 48px;
            object-fit: contain;
        }

        .header-logo-text {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: var(--gold);
        }

        .header-title {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.2rem;
            border: 1px solid rgba(255, 249, 235, 0.35);
            border-radius: 3px;
            color: var(--gold);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: all 0.3s;
            font-family: 'Outfit', sans-serif;
        }
        .back-btn:hover {
            background: rgba(128, 1, 31, 0.3);
            border-color: var(--gold);
        }

        /* ── Loading Screen ── */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--dark-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            gap: 2rem;
        }

        .loading-logo {
            height: 120px;
            opacity: 0.9;
        }

        .loading-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: var(--gold);
            letter-spacing: 3px;
        }

        .loading-bar-track {
            width: 280px;
            height: 2px;
            background: rgba(128, 1, 31, 0.35);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-bar-fill {
            height: 100%;
            background: linear-gradient(to right, #80011f, #9e0226);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 2px;
        }

        .loading-percent {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        /* ── Main Viewer Area ── */
        #viewer-area {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem 1rem 1rem;
            gap: 1rem;
            overflow: hidden;
        }

        /* Book wrapper gets remaining space and scrolls internally if needed */
        #book-wrapper {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
            overflow: hidden;
        }

        #flipbook-container {
            flex: 1;
            min-height: 0;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ── Controls Bar ── */
        .controls {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(245, 237, 216, 0.95);
            border: 1px solid rgba(128, 1, 31, 0.35);
            border-radius: 6px;
            padding: 0.4rem 1rem;
            flex-wrap: wrap;
            justify-content: center;
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 1rem;
            cursor: pointer;
            padding: 0.4rem 0.7rem;
            border-radius: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
        }
        .ctrl-btn:hover { background: rgba(128, 1, 31, 0.25); }
        .ctrl-btn:disabled { color: rgba(128, 1, 31, 0.5); cursor: not-allowed; }
        .ctrl-btn i { font-size: 0.95rem; }

        .ctrl-divider {
            width: 1px;
            height: 22px;
            background: rgba(128, 1, 31, 0.35);
        }

        .page-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            min-width: 90px;
            text-align: center;
        }

        .page-input-group {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .page-jump-input {
            width: 52px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(128,1,31,0.5);
            border-radius: 3px;
            color: white;
            text-align: center;
            padding: 0.25rem 0.4rem;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            outline: none;
        }
        .page-jump-input:focus { border-color: var(--gold); }

        /* ── Book Container ── */
        .nav-arrow {
            background: rgba(245, 237, 216, 0.9);
            border: 1px solid rgba(128, 1, 31, 0.5);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .nav-arrow:hover { background: rgba(128,1,31,0.25); border-color: var(--gold); }
        .nav-arrow:disabled { color: rgba(128,1,31,0.35); cursor: not-allowed; border-color: rgba(128,1,31,0.15); }

        /* shadow on the inner book, not the container */
        #flipbook {
            box-shadow:
                0 0 0 1px rgba(128,1,31,0.2),
                0 20px 60px rgba(128,1,31,0.12),
                0 4px 20px rgba(0,0,0,0.08);
            border-radius: 2px;
        }

        /* The actual flipbook element */
        #flipbook {
            display: flex;
            background: #fff;
        }

        .page-canvas-wrap {
            position: relative;
            display: inline-block;
            background: #fff;
        }

        .page-canvas-wrap canvas {
            display: block;
        }

        /* Page number overlay */
        .page-num-overlay {
            position: absolute;
            bottom: 8px;
            width: 100%;
            text-align: center;
            font-family: 'Outfit', sans-serif;
            font-size: 10px;
            color: rgba(0,0,0,0.35);
            pointer-events: none;
        }

        /* ── Thumbnails ── */
        #thumb-panel {
            width: 100%;
            max-width: 1200px;
            background: rgba(245, 237, 216, 0.85);
            border: 1px solid rgba(128, 1, 31, 0.25);
            border-radius: 6px;
            padding: 0.6rem 1rem;
            flex-shrink: 0;
        }

        .thumb-header {
            font-family: 'Playfair Display', serif;
            font-size: 0.9rem;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        #thumb-strip {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            scrollbar-width: thin;
            scrollbar-color: var(--gold-dark) transparent;
        }

        #thumb-strip::-webkit-scrollbar { height: 4px; }
        #thumb-strip::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 2px; }

        .thumb-item {
            flex-shrink: 0;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 3px;
            overflow: hidden;
            transition: all 0.2s;
            position: relative;
        }
        .thumb-item:hover { border-color: var(--gold-light); transform: translateY(-2px); }
        .thumb-item.active { border-color: var(--gold); box-shadow: 0 0 12px rgba(128,1,31,0.6); }

        .thumb-item canvas { display: block; }

        .thumb-num {
            position: absolute;
            bottom: 2px;
            width: 100%;
            text-align: center;
            font-size: 9px;
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.4);
            padding: 1px 0;
        }

        /* ── Fullscreen overlay ── */
        #fullscreen-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 249, 235, 0.98);
            z-index: 500;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }
        #fullscreen-overlay.active { display: flex; }

        #fs-canvas-wrap {
            max-width: 90vw;
            max-height: 85vh;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(128,1,31,0.2);
            border: 1px solid rgba(128,1,31,0.35);
        }
        #fs-canvas-wrap canvas { display: block; max-width: 90vw; max-height: 85vh; object-fit: contain; }

        .fs-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        #fs-close {
            position: fixed;
            top: 1.5rem;
            right: 2rem;
            background: none;
            border: none;
            color: var(--gold);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* ── Responsive ── */
        @media (max-width: 900px) {
            .nav-arrow { width: 38px; height: 38px; font-size: 1rem; }
            header { padding: 0.8rem 1.2rem; }
        }

        @media (max-width: 600px) {
            .nav-arrow { display: none; }
            .header-title { display: none; }
        }
    </style>
</head>
<body>

<!-- Loading Screen -->
<div id="loading-screen">
    <img src="LOGO.png" alt="AVINA JEWELS" class="loading-logo" onerror="this.style.display='none'">
    <div class="loading-text">Loading Catalog</div>
    <div class="loading-bar-track"><div class="loading-bar-fill" id="load-bar"></div></div>
    <div class="loading-percent" id="load-percent">0%</div>
</div>

<!-- Header -->
<header>
    <a href="index.html" class="header-logo">
        <img src="LOGO.png" alt="AVINA JEWELS" onerror="this.style.display='none'">
    </a>
    <div class="header-title">Jewelry Catalog — JCK</div>
    <div class="header-actions">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Home</a>
    </div>
</header>

<!-- Viewer -->
<div id="viewer-area">

    <!-- Controls -->
    <div class="controls">
        <button class="ctrl-btn" id="btn-first" title="First page"><i class="fas fa-angles-left"></i></button>
        <button class="ctrl-btn" id="btn-prev"><i class="fas fa-chevron-left"></i> Prev</button>
        <div class="ctrl-divider"></div>
        <span class="page-info" id="page-info">— / —</span>
        <div class="ctrl-divider"></div>
        <div class="page-input-group">
            Go to <input type="number" class="page-jump-input" id="page-jump" min="1"> <button class="ctrl-btn" id="btn-go" style="padding:0.25rem 0.6rem">Go</button>
        </div>
        <div class="ctrl-divider"></div>
        <button class="ctrl-btn" id="btn-next">Next <i class="fas fa-chevron-right"></i></button>
        <button class="ctrl-btn" id="btn-last" title="Last page"><i class="fas fa-angles-right"></i></button>
        <div class="ctrl-divider"></div>
        <button class="ctrl-btn" id="btn-zoom-out" title="Zoom out"><i class="fas fa-magnifying-glass-minus"></i></button>
        <button class="ctrl-btn" id="btn-zoom-in" title="Zoom in"><i class="fas fa-magnifying-glass-plus"></i></button>
        <div class="ctrl-divider"></div>
        <button class="ctrl-btn" id="btn-fullscreen" title="Fullscreen"><i class="fas fa-expand"></i></button>
        <button class="ctrl-btn" id="btn-download" title="Download catalog"><i class="fas fa-download"></i> Download</button>
    </div>

    <!-- Book -->
    <div id="book-wrapper">
        <button class="nav-arrow" id="nav-prev" title="Previous spread"><i class="fas fa-chevron-left"></i></button>

        <div id="flipbook-container">
            <div id="flipbook"></div>
        </div>

        <button class="nav-arrow" id="nav-next" title="Next spread"><i class="fas fa-chevron-right"></i></button>
    </div>

    <!-- Thumbnails -->
    <div id="thumb-panel">
        <div class="thumb-header"><i class="fas fa-grip" style="margin-right:0.5rem"></i>All Pages</div>
        <div id="thumb-strip"></div>
    </div>

</div>

<!-- Fullscreen Overlay -->
<div id="fullscreen-overlay">
    <button id="fs-close" title="Close"><i class="fas fa-xmark"></i></button>
    <div id="fs-canvas-wrap"><canvas id="fs-canvas"></canvas></div>
    <div class="fs-controls">
        <button class="ctrl-btn" id="fs-prev"><i class="fas fa-chevron-left"></i> Prev</button>
        <span class="page-info" id="fs-page-info"></span>
        <button class="ctrl-btn" id="fs-next">Next <i class="fas fa-chevron-right"></i></button>
    </div>
</div>

<script>
    // ── Config ──────────────────────────────────────────────────────────────
    const PDF_URL = 'catalog.pdf';
    const THUMB_W = 80;

    // ── State ────────────────────────────────────────────────────────────────
    let pdfDoc      = null;
    let totalPages  = 0;
    let currentPage = 1;
    let scale       = 1;
    let isSingle    = window.innerWidth < 700;
    let pageCache   = {};
    let fsPage      = 1;

    // Compute scale so the spread fits inside the book-wrapper area
    async function computeAutoScale() {
        const wrapper   = document.getElementById('book-wrapper');
        const availW    = wrapper.clientWidth  - 120; // leave room for arrows
        const availH    = wrapper.clientHeight - 20;
        const numPages  = isSingle ? 1 : 2;

        const firstPage = await pdfDoc.getPage(currentPage);
        const nativeVp  = firstPage.getViewport({ scale: 1 });
        const nativeW   = nativeVp.width  * numPages;
        const nativeH   = nativeVp.height;

        const scaleByW = availW / nativeW;
        const scaleByH = availH / nativeH;
        return Math.min(scaleByW, scaleByH, 2.0); // cap at 2×
    }

    // ── Boot PDF.js ──────────────────────────────────────────────────────────
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    async function loadPDF() {
        const loadingTask = pdfjsLib.getDocument(PDF_URL);

        loadingTask.onProgress = function(p) {
            if (p.total) {
                const pct = Math.round((p.loaded / p.total) * 100);
                document.getElementById('load-bar').style.width = pct + '%';
                document.getElementById('load-percent').textContent = pct + '%';
            }
        };

        pdfDoc     = await loadingTask.promise;
        totalPages = pdfDoc.numPages;

        document.getElementById('page-jump').max = totalPages;
        document.getElementById('load-bar').style.width = '100%';
        document.getElementById('load-percent').textContent = '100%';

        await renderSpread(1);
        renderAllThumbs();

        setTimeout(() => {
            document.getElementById('loading-screen').style.opacity = '0';
            document.getElementById('loading-screen').style.transition = 'opacity 0.5s';
            setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);
        }, 300);
    }

    // ── Render a single page to an offscreen canvas ──────────────────────────
    async function renderPage(pageNum, targetScale) {
        const cacheKey = `${pageNum}_${targetScale}`;
        if (pageCache[cacheKey]) return pageCache[cacheKey];

        const page   = await pdfDoc.getPage(pageNum);
        const vp     = page.getViewport({ scale: targetScale });
        const canvas = document.createElement('canvas');
        canvas.width  = vp.width;
        canvas.height = vp.height;
        const ctx    = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        pageCache[cacheKey] = canvas;
        return canvas;
    }

    // ── Render spread (1 or 2 pages) ────────────────────────────────────────
    async function renderSpread(startPage, forceScale) {
        currentPage = Math.max(1, Math.min(startPage, totalPages));
        updateControls();

        scale = forceScale !== undefined ? forceScale : await computeAutoScale();

        const flipbook = document.getElementById('flipbook');
        flipbook.innerHTML = '';

        const pages = isSingle
            ? [currentPage]
            : (currentPage === 1 ? [1] : [currentPage, currentPage + 1]);

        for (const pn of pages) {
            if (pn > totalPages) continue;
            const canvas = await renderPage(pn, scale);

            const wrap = document.createElement('div');
            wrap.className = 'page-canvas-wrap';

            const cloned = document.createElement('canvas');
            cloned.width  = canvas.width;
            cloned.height = canvas.height;
            cloned.getContext('2d').drawImage(canvas, 0, 0);

            const numEl = document.createElement('div');
            numEl.className = 'page-num-overlay';
            numEl.textContent = pn;

            wrap.appendChild(cloned);
            wrap.appendChild(numEl);
            flipbook.appendChild(wrap);
        }

        updateThumbHighlight();
    }

    // ── Navigation ───────────────────────────────────────────────────────────
    function pagesPerSpread() { return isSingle ? 1 : 2; }

    function goNext() {
        const step = (currentPage === 1 && !isSingle) ? 1 : pagesPerSpread();
        const next = currentPage + step;
        if (next <= totalPages) renderSpread(next);
    }

    function goPrev() {
        const step = (currentPage <= 2 && !isSingle) ? 1 : pagesPerSpread();
        const prev = currentPage - step;
        if (prev >= 1) renderSpread(prev);
    }

    // ── Controls update ──────────────────────────────────────────────────────
    function updateControls() {
        const pps  = pagesPerSpread();
        const end  = Math.min(currentPage + (isSingle ? 0 : 1), totalPages);
        const info = isSingle
            ? `Page ${currentPage} / ${totalPages}`
            : (currentPage === end ? `Page ${currentPage} / ${totalPages}` : `Pages ${currentPage}–${end} / ${totalPages}`);

        document.getElementById('page-info').textContent = info;
        document.getElementById('page-jump').value = currentPage;

        const atStart = currentPage <= 1;
        const atEnd   = currentPage + pps - 1 >= totalPages;

        ['btn-first','btn-prev','nav-prev'].forEach(id => document.getElementById(id).disabled = atStart);
        ['btn-last','btn-next','nav-next'].forEach(id => document.getElementById(id).disabled = atEnd);
    }

    // ── Thumbnails ───────────────────────────────────────────────────────────
    async function renderAllThumbs() {
        const strip = document.getElementById('thumb-strip');
        strip.innerHTML = '';

        for (let p = 1; p <= totalPages; p++) {
            const item = document.createElement('div');
            item.className = 'thumb-item';
            item.dataset.page = p;

            const placeholderCanvas = document.createElement('canvas');
            placeholderCanvas.width  = THUMB_W;
            placeholderCanvas.height = Math.round(THUMB_W * 1.41);
            const pCtx = placeholderCanvas.getContext('2d');
            pCtx.fillStyle = '#e8e0d5';
            pCtx.fillRect(0, 0, placeholderCanvas.width, placeholderCanvas.height);

            const numEl = document.createElement('div');
            numEl.className = 'thumb-num';
            numEl.textContent = p;

            item.appendChild(placeholderCanvas);
            item.appendChild(numEl);
            item.addEventListener('click', () => {
                const pg = parseInt(item.dataset.page);
                const startPg = (isSingle || pg === 1) ? pg : (pg % 2 === 0 ? pg : pg - 1);
                renderSpread(startPg === 0 ? 1 : startPg);
            });

            strip.appendChild(item);

            // Async render thumbs in batches to avoid blocking
            (async (pageNum, el) => {
                const thumbScale = THUMB_W / (await (async () => {
                    const pg = await pdfDoc.getPage(pageNum);
                    return pg.getViewport({ scale: 1 }).width;
                })());

                const canvas = await renderPage(pageNum, thumbScale);
                const clone  = document.createElement('canvas');
                clone.width  = canvas.width;
                clone.height = canvas.height;
                clone.getContext('2d').drawImage(canvas, 0, 0);
                el.replaceChild(clone, el.firstChild);
            })(p, item);
        }
    }

    function updateThumbHighlight() {
        document.querySelectorAll('.thumb-item').forEach(el => {
            const p = parseInt(el.dataset.page);
            const inSpread = isSingle
                ? p === currentPage
                : (p === currentPage || p === currentPage + 1);
            el.classList.toggle('active', inSpread);
        });

        // Scroll active thumb into view
        const activeThumb = document.querySelector('.thumb-item.active');
        if (activeThumb) {
            activeThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
    }

    // ── Zoom ─────────────────────────────────────────────────────────────────
    function zoomIn()  { pageCache = {}; renderSpread(currentPage, Math.min(scale + 0.2, 2.5)); }
    function zoomOut() { pageCache = {}; renderSpread(currentPage, Math.max(scale - 0.2, 0.3)); }

    // Re-fit on window resize
    window.addEventListener('resize', () => { pageCache = {}; renderSpread(currentPage); });

    // ── Fullscreen ───────────────────────────────────────────────────────────
    async function openFullscreen(pageNum) {
        fsPage = pageNum || currentPage;
        await renderFS();
        document.getElementById('fullscreen-overlay').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    async function renderFS() {
        const fsScale = Math.min(
            (window.innerWidth  * 0.88) / (await (async () => {
                const pg = await pdfDoc.getPage(fsPage);
                return pg.getViewport({ scale: 1 }).width;
            })()),
            (window.innerHeight * 0.82) / (await (async () => {
                const pg = await pdfDoc.getPage(fsPage);
                return pg.getViewport({ scale: 1 }).height;
            })())
        );

        const canvas = await renderPage(fsPage, fsScale);
        const fsCanvas = document.getElementById('fs-canvas');
        fsCanvas.width  = canvas.width;
        fsCanvas.height = canvas.height;
        fsCanvas.getContext('2d').drawImage(canvas, 0, 0);
        document.getElementById('fs-page-info').textContent = `Page ${fsPage} / ${totalPages}`;
    }

    function closeFullscreen() {
        document.getElementById('fullscreen-overlay').classList.remove('active');
        document.body.style.overflow = '';
    }

    // ── Keyboard ─────────────────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
        if (document.getElementById('fullscreen-overlay').classList.contains('active')) {
            if (e.key === 'ArrowRight') { fsPage = Math.min(fsPage + 1, totalPages); renderFS(); }
            if (e.key === 'ArrowLeft')  { fsPage = Math.max(fsPage - 1, 1); renderFS(); }
            if (e.key === 'Escape')     closeFullscreen();
            return;
        }
        if (e.key === 'ArrowRight') goNext();
        if (e.key === 'ArrowLeft')  goPrev();
    });

    // ── Touch/Swipe ──────────────────────────────────────────────────────────
    let touchStartX = 0;
    document.getElementById('flipbook-container').addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
    }, { passive: true });
    document.getElementById('flipbook-container').addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) dx < 0 ? goNext() : goPrev();
    }, { passive: true });

    // ── Wire up buttons ───────────────────────────────────────────────────────
    document.getElementById('btn-first').addEventListener('click', () => renderSpread(1));
    document.getElementById('btn-last').addEventListener('click',  () => renderSpread(totalPages % 2 === 0 ? totalPages - 1 : totalPages));
    document.getElementById('btn-prev').addEventListener('click',  goPrev);
    document.getElementById('btn-next').addEventListener('click',  goNext);
    document.getElementById('nav-prev').addEventListener('click',  goPrev);
    document.getElementById('nav-next').addEventListener('click',  goNext);

    document.getElementById('btn-zoom-in').addEventListener('click',  zoomIn);
    document.getElementById('btn-zoom-out').addEventListener('click', zoomOut);

    document.getElementById('btn-go').addEventListener('click', () => {
        const pg = parseInt(document.getElementById('page-jump').value);
        if (pg >= 1 && pg <= totalPages) {
            const start = (isSingle || pg === 1) ? pg : (pg % 2 === 0 ? pg : pg - 1);
            renderSpread(start < 1 ? 1 : start);
        }
    });
    document.getElementById('page-jump').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('btn-go').click();
    });

    document.getElementById('btn-fullscreen').addEventListener('click', () => openFullscreen(currentPage));
    document.getElementById('fs-close').addEventListener('click', closeFullscreen);
    document.getElementById('fs-prev').addEventListener('click', () => { fsPage = Math.max(fsPage - 1, 1); renderFS(); });
    document.getElementById('fs-next').addEventListener('click', () => { fsPage = Math.min(fsPage + 1, totalPages); renderFS(); });

    document.getElementById('btn-download').addEventListener('click', () => {
        const a = document.createElement('a');
        a.href     = PDF_URL;
        a.download = 'AVINA-Jewels-Catalog.pdf';
        a.click();
    });

    // Double-click page to fullscreen
    document.getElementById('flipbook').addEventListener('dblclick', e => {
        const wrap = e.target.closest('.page-canvas-wrap');
        if (!wrap) return;
        const pageNum = parseInt(wrap.querySelector('.page-num-overlay').textContent);
        openFullscreen(pageNum);
    });

    // ── Start ─────────────────────────────────────────────────────────────────
    loadPDF();
</script>
</body>
</html>
